<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAG Chatbot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="/static/styles.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container-fluid vh-100">

    <div class="row h-100">

        <!-- Sidebar -->
        <div
            class="col-12 col-md-3 col-lg-2 sidebar p-3"
        >

            <h5 class="mb-3">
                RAG Chatbot
            </h5>

            <button
                id="newConversationBtn"
                class="btn btn-primary w-100 mb-3"
            >
                + New Chat
            </button>

            <button
                class="btn btn-outline-secondary w-100 mb-3"
                data-bs-toggle="modal"
                data-bs-target="#uploadModal"
            >
                Upload Document
            </button>

            <button
                id="refreshDocumentsBtn"
                class="btn btn-outline-secondary w-100 mb-2"
            >
                Refresh Documents
            </button>
            <div id="documentList" class"small">
                
            </div>
            <hr>

            <div class="small text-muted mb-2">
                Conversations
            </div>

            <div
                id="conversationList"
                class="conversation-list"
            >
            </div>

        </div>


        <!-- Main chat area -->
        <div
            class="col-12 col-md-9 col-lg-10 d-flex flex-column p-0"
        >

            <!-- Header -->
            <div class="chat-header p-3 border-bottom">

                <h5
                    id="conversationTitle"
                    class="mb-0"
                >
                    New Conversation
                </h5>

            </div>


            <!-- Messages -->
            <div
                id="chatMessages"
                class="chat-messages flex-grow-1 p-4"
            >

                <div
                    id="emptyState"
                    class="text-center text-muted mt-5"
                >
                    <h4>Ask a question</h4>

                    <p>
                        Answers will be generated using
                        your uploaded documents.
                    </p>
                </div>

            </div>


            <!-- Loading -->
            <div
                id="loadingState"
                class="px-4 pb-2 d-none"
            >

                <div
                    class="spinner-border spinner-border-sm"
                    role="status"
                >
                </div>

                <span class="ms-2">
                    Searching documents and generating response...
                </span>

            </div>


            <!-- Input -->
            <div class="chat-input border-top p-3">

                <form id="chatForm">

                    <div class="input-group">

                        <textarea
                            id="questionInput"
                            class="form-control"
                            rows="2"
                            placeholder="Ask something about your documents..."
                            required
                        ></textarea>

                        <button
                            id="sendButton"
                            class="btn btn-primary"
                            type="submit"
                        >
                            Send
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Upload Modal -->
<div
    class="modal fade"
    id="uploadModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Upload Document
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                >
                </button>

            </div>


            <div class="modal-body">

                <form id="uploadForm">

                    <input
                        id="documentFile"
                        type="file"
                        class="form-control mb-3"
                        accept=".pdf,.txt"
                        required
                    >

                    <button
                        id="uploadButton"
                        type="submit"
                        class="btn btn-primary"
                    >
                        Upload and Index
                    </button>

                </form>


                <div
                    id="uploadStatus"
                    class="mt-3"
                >
                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="/static/app.js"></script>

</body>

</html>
